name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  specs:
    name: SpecDD contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/specdd/.node-version
      - name: Install pinned development validator
        working-directory: tools/specdd
        run: npm ci --omit=dev --ignore-scripts --no-fund --no-audit
      - name: Audit validator runtime dependencies
        working-directory: tools/specdd
        run: npm run audit
      - name: Validate SpecDD syntax
        working-directory: tools/specdd
        run: npm run lint
      - name: Verify discovery, references and requirement traceability
        working-directory: tools/specdd
        run: npm test

  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.1-unprivileged@sha256:801777072776dc81b2a9dd2007b2ed487571f21ecd30efffd15ddb1671f2193d
        ports:
          - 6333:6333
    env:
      RUN_QDRANT_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic test suite
        run: python -m unittest discover -s tests -v

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect secrets in Git history and working tree
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
