[workspace]
members = ["crates/chatpurp-core", "crates/chatpurp-contracts", "crates/chatpurp-api", "crates/chatpurp-web"]
default-members = ["crates/chatpurp-core", "crates/chatpurp-contracts", "crates/chatpurp-api"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "net", "time", "sync", "io-util"] }
hyper = { version = "=1.11.1", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio", "server", "service", "http1"] }
jsonwebtoken = { version = "=11.0.0", default-features = false, features = ["aws_lc_rs"] }
aws-lc-rs = "=1.18.1"
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }
dioxus = { version = "=0.7.10", default-features = false, features = ["minimal", "web"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json"] }

[profile.dev]
debug = 0

[profile.test]
debug = 0
