services:
  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged@sha256:801777072776dc81b2a9dd2007b2ed487571f21ecd30efffd15ddb1671f2193d
    container_name: llm-lab-qdrant
    user: "1000:1000"
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - llm-lab-qdrant-data:/qdrant/storage
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    restart: "no"

volumes:
  llm-lab-qdrant-data:
    name: llm-lab-qdrant-data
